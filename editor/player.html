<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Push Player">
<title>Push 3 Player</title>
<style>
  :root { --bg: #0b0c0e; --panel: #16181c; --line: #2a2d33; --text: #eef0f3; --muted: #8a909a; --accent: #ff7a1a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.25 -apple-system, "Helvetica Neue", Arial, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body { padding: max(8px, env(safe-area-inset-top)) 12px 12px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button:active { filter: brightness(1.5); }
  .top { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .top .where { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .top .where b { color: var(--text); }
  .chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .chip.user { color: #0b0c0e; background: var(--accent); border-color: var(--accent); }
  .chip.off { color: #ff6b6b; }
  .sec { margin-top: 8px; }
  #tracks { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  #tracks button { flex: none; padding: 4px 9px; font-size: 13px; border-left-width: 4px; white-space: nowrap; }
  #tracks button.sel { background: #fff; color: #000; }
  .grid8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  #racks button { min-height: 46px; font-weight: 700; color: #000; border: none; }
  #racks button.absent { background: transparent !important; color: var(--muted); border: 1px dashed var(--line); }
  #racks button.inuse { background: #fff !important; outline: 3px solid #fff; outline-offset: 1px; }
  .knob { position: relative; height: 84px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
  .knob.empty { background: transparent; border-style: dashed; }
  .knob .fill { position: absolute; left: 0; right: 0; bottom: 0; opacity: .8; }
  .knob .lbl { position: absolute; left: 7px; right: 6px; top: 5px; font-weight: 800; font-size: 19px; line-height: 1.1; text-shadow: 0 1px 2px #000; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .knob .val { position: absolute; left: 7px; right: 6px; bottom: 5px; font-size: 15px; font-weight: 600; color: #ddd; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
  #vars button { min-height: 52px; padding: 3px 4px; color: #000; border: none; font-weight: 700; font-size: 14px; line-height: 1.1; overflow: hidden; transition: transform .08s; }
  #vars button small { display: block; font-size: 11px; opacity: .7; font-weight: 600; }
  #vars button.none { background: transparent !important; color: #3a3d44; border: 1px solid #1f2126; }
  #vars button.sel { background: #fff !important; }
  #vars button.pending { outline: 3px solid #fff; outline-offset: -3px; transform: scale(.94); filter: brightness(1.35); }
  #vars button.add { background: transparent !important; color: var(--text); border: 2px dashed var(--muted); font-size: 26px; font-weight: 400; }
  #vars button.add.armed { border-color: var(--accent); color: var(--accent); animation: pulse .8s infinite alternate; }
  #vars button.confirm { background: #ff4d4d !important; color: #fff; font-size: 12px; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
  .hint { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 4px; }
  .tools { display: flex; gap: 6px; margin-top: 6px; }
  .tools .danger { color: #ff8a8a; }
  #notice { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #000d; border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #notice.on { opacity: 1; }
  .muted { color: var(--muted); }
  @media (max-width: 760px) { .grid8 { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="top">
  <div class="where" id="where">…</div>
  <span id="mode" class="chip">…</span>
  <button id="btnRefresh" title="Pročitaj stanje iz Livea">↻</button>
  <button id="btnRescan" title="Isto što gumb Rackovi na deviceu">Rackovi</button>
  <button id="btnFull" title="Cijeli ekran">⛶</button>
</div>
<div class="sec" id="tracks"></div>
<div class="sec grid8" id="racks"></div>
<div class="sec grid8" id="macros"></div>
<div class="sec grid8" id="vars"></div>
<div class="hint" id="hint"></div>
<div class="tools">
  <button id="btnRandom">Random makroi</button>
  <button id="btnDelete" class="danger">Obriši odabranu</button>
</div>
<div id="notice"></div>
<script src="player.js"></script>
</body>
</html>
